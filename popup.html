<!DOCTYPE html>
<html>
<head>
  <title>OML</title>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <img src="icon.png" alt="OML Logo" width="24" height="24">
      </div>
      <div class="header-actions">
        <button id="refresh" class="icon-btn" title="Refresh">
          <img src="assets/refresh.svg" alt="Refresh">
        </button>
        <div class="more-menu-container">
          <button id="moreBtn" class="icon-btn" title="More">
            <img src="assets/more.svg" alt="More">
          </button>
          <div id="moreMenu" class="dropdown-menu">
            <a id="export" href="#">Export Memories</a>
            <a id="clear" href="#">Clear All Memories</a>
          </div>
        </div>
      </div>
    </header>

    <!-- Upload Area -->
    <div id="dropArea" class="drop-area">
      <p>Drag & drop a .json file here or <a href="#" id="browseLink">browse</a> to import.</p>
      <input type="file" id="file" accept=".json" hidden>
    </div>

    <!-- Profile Card -->
    <div class="profile-card">
      <div class="profile-info">
        <div id="profileName" class="profile-name"></div>
        <div id="profileDesc" class="profile-description"></div>
        <div id="profileLocation" class="profile-location"></div>
      </div>
      <button id="editProfile" class="edit-profile-btn" title="Edit Profile">
        <img src="assets/edit.svg" alt="Edit Profile">
      </button>
    </div>

    <!-- Memories Title -->
    <div id="memoriesTitle" class="memories-title"></div>

    <!-- Search and Filter Bar -->
    <div class="filter-bar">
      <div class="search-wrapper">
        <img src="assets/search.svg" alt="Search" class="search-icon">
        <input type="text" id="search" placeholder="Search memories...">
      </div>
      <select id="tagFilter">
        <option value="">All Tags</option>
      </select>
      <div class="sort-menu-container">
        <button id="sortBtn" class="icon-btn" title="Sort">
          <img src="assets/sort.svg" alt="Sort">
        </button>
        <div id="sortMenu" class="dropdown-menu">
          <a href="#" data-sort="date_desc">Newest First</a>
          <a href="#" data-sort="date_asc">Oldest First</a>
          <a href="#" data-sort="has_link">Has Link</a>
        </div>
      </div>
      <div id="memCounter" class="mem-counter"></div>
    </div>

    <!-- Memory List -->
    <div id="memList" class="mem-list">
      <!-- Memory items will be injected here by popup.js -->
    </div>

    <!-- Modal for Full Memory Text -->
    <div id="memModal" class="modal">
      <div class="modal-content">
        <span id="closeModal" class="close-btn">&times;</span>
        <pre id="fullMemoryText"></pre>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
